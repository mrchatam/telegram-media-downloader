name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check tag matches the package version
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version=$(node -p "require('./package.json').version")
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${pkg_version}. Run 'npm run version:sync' and re-tag."
            exit 1
          fi

      - name: Verify and build
        run: npm run verify

      - name: Verify archive contents
        run: |
          set -euo pipefail
          zip_file=$(ls dist/*.zip)
          unzip -tq "$zip_file"
          unzip -l "$zip_file" | grep -qE '[[:space:]]manifest\.json$'

      - name: Generate SHA-256 checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum *.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Extract release notes from CHANGELOG
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { found = 1; next }
            /^## \[/ { if (found) exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "See CHANGELOG.md for details." > release-notes.md
          fi
          cat >> release-notes.md <<'NOTES'

          ---

          **Verify your download.** Save `SHA256SUMS` next to the archive, then:

          ```bash
          sha256sum -c SHA256SUMS        # macOS: shasum -a 256 -c SHA256SUMS
          ```

          The archive is built deterministically from this tag, so `npm run build` on the same
          Node.js major version reproduces the same bytes. See “Verify it yourself” in the README.
          NOTES
          cat release-notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS \
            --title "Telegram Media Downloader ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md \
            --verify-tag
